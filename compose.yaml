name: memoria-ia-server

services:
  model-gateway:
    build:
      context: .
      dockerfile: docker/model-gateway/Dockerfile
    environment:
      MODEL_GATEWAY_HOST: 0.0.0.0
      MODEL_GATEWAY_PORT: 8090
      MODEL_GATEWAY_DATA_DIR: /data
      MODEL_GATEWAY_ADMIN_KEY: ${MEMORIA_API_KEY}
      MODEL_GATEWAY_RUNTIME_KEY: ${MEMORIA_API_KEY}
      MODEL_GATEWAY_TIMEOUT: ${MODEL_GATEWAY_TIMEOUT:-120}
      MEMORIA_API_URL: http://memoria:8080
      MEMORIA_API_KEY: ${MEMORIA_API_KEY}
    volumes:
      - model-gateway-data:/data
    expose: ["8090"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 5
    security_opt: ["no-new-privileges:true"]
    networks: [internal]

  memoria:
    build:
      context: .
      dockerfile: docker/memoria/Dockerfile
      args:
        MEMORIA_COMMIT: ${MEMORIA_COMMIT:-973564683762fde26c36a6993a2982f804504bc1}
        BDR_COMMIT: ${BDR_COMMIT:-1f6b7ccbe16bdfed2f1b5dcebceb17887bf6916e}
    environment:
      MEMORIA_ORGANIZATION_ID: ${MEMORIA_ORGANIZATION_ID}
      MEMORIA_ORGANIZATION_NAME: ${MEMORIA_ORGANIZATION_NAME}
      MEMORIA_NODE_ID: ${MEMORIA_NODE_ID}
      MEMORIA_API_KEY: ${MEMORIA_API_KEY}
      MEMORIA_DATA_DIR: /data
      MEMORIA_CONVERSATION_RUNTIME: native
      MEMORIA_EPISODIC_RUNTIME: native
      MEMORIA_NATIVE_LIB: /usr/local/lib/libmemoria_mobile.so
      OPENAI_BASE_URL: http://model-gateway:8090/v1
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      MEMORIA_LLM_INPUT_USD_PER_MILLION: ${MEMORIA_LLM_INPUT_USD_PER_MILLION:-}
      MEMORIA_LLM_OUTPUT_USD_PER_MILLION: ${MEMORIA_LLM_OUTPUT_USD_PER_MILLION:-}
      MEMORIA_PUBLIC_KEY: ${MEMORIA_PUBLIC_KEY:-}
      MEMORIA_CERTIFICATE_REF: ${MEMORIA_CERTIFICATE_REF:-}
      MEMORIA_CERTIFICATE_STATUS: ${MEMORIA_CERTIFICATE_STATUS:-not_configured}
      MEMORIA_CAPABILITIES: ${MEMORIA_CAPABILITIES:-memory.read,memory.write}
      MEMORIA_LICENSE_STATUS: ${MEMORIA_LICENSE_STATUS:-not_configured}
      MEMORIA_LICENSE_ID: ${MEMORIA_LICENSE_ID:-}
      MEMORIA_LICENSE_PLAN: ${MEMORIA_LICENSE_PLAN:-early_access}
      MEMORIA_LICENSE_VALID_UNTIL: ${MEMORIA_LICENSE_VALID_UNTIL:-}
      MEMORIA_LICENSE_MAX_NODES: ${MEMORIA_LICENSE_MAX_NODES:-1}
      MEMORIA_LICENSE_CAPABILITIES: ${MEMORIA_LICENSE_CAPABILITIES:-memory.read,memory.write,chat.use}
    volumes:
      - memoria-data:/data
    depends_on:
      model-gateway: {condition: service_healthy}
    expose: ["8080"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 5
    security_opt: ["no-new-privileges:true"]
    networks: [internal]

  bdr-explorer:
    build:
      context: .
      dockerfile: docker/bdr-explorer/Dockerfile
      args:
        BDR_COMMIT: ${BDR_COMMIT:-1f6b7ccbe16bdfed2f1b5dcebceb17887bf6916e}
    command: ["python", "-m", "explorer.server", "--host", "0.0.0.0", "--port", "8765", "--memoria-url", "http://memoria:8080", "--memoria-api-key", "${MEMORIA_API_KEY}"]
    depends_on:
      memoria: {condition: service_healthy}
    expose: ["8765"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8765/api/health', timeout=3)); assert d.get('status') == 'ok' and d.get('mode') == 'memoria.ia-live'"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 5
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    networks: [internal]

  llama:
    profiles: ["local-llm"]
    image: ${MEMORIA_LLAMA_IMAGE:-ghcr.io/ggml-org/llama.cpp:server}
    command: ["-m", "/models/${MEMORIA_LLAMA_MODEL_FILE:-model.gguf}", "--host", "0.0.0.0", "--port", "8080", "-c", "${MEMORIA_LLAMA_CONTEXT_SIZE:-4096}", "-t", "${MEMORIA_LLAMA_THREADS:-4}", "--alias", "${MEMORIA_LLAMA_MODEL_ALIAS:-local-llama}"]
    volumes:
      - "${MEMORIA_LLAMA_MODELS_DIR:-./models}:/models:ro"
    expose: ["8080"]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    networks: [internal]

  server:
    build:
      context: .
      dockerfile: docker/server-shell/Dockerfile
    environment:
      MEMORIA_SERVER_HOST: 0.0.0.0
      MEMORIA_SERVER_PORT: 8780
      MEMORIA_API_URL: http://memoria:8080
      BDR_EXPLORER_URL: http://bdr-explorer:8765
      MODEL_GATEWAY_URL: http://model-gateway:8090
      MODEL_GATEWAY_ADMIN_KEY: ${MEMORIA_API_KEY}
      MEMORIA_SERVER_PROXY_TIMEOUT: ${MEMORIA_SERVER_PROXY_TIMEOUT:-30}
      MEMORIA_AUTOTEST_TIMEOUT: ${MEMORIA_AUTOTEST_TIMEOUT:-180}
      MEMORIA_SERVER_MAX_REQUEST_BYTES: ${MEMORIA_SERVER_MAX_REQUEST_BYTES:-10485760}
      MEMORIA_SERVER_ADMIN_USER: ${MEMORIA_SERVER_ADMIN_USER:-admin}
      MEMORIA_SERVER_ADMIN_PASSWORD: ${MEMORIA_SERVER_ADMIN_PASSWORD}
      MEMORIA_SERVER_SESSION_HOURS: ${MEMORIA_SERVER_SESSION_HOURS:-8}
      MEMORIA_SERVER_COOKIE_SECURE: ${MEMORIA_SERVER_COOKIE_SECURE:-false}
      MEMORIA_API_KEY: ${MEMORIA_API_KEY}
      MEMORIA_CURIOSITY_ENABLED: ${MEMORIA_CURIOSITY_ENABLED:-true}
      MEMORIA_CURIOSITY_DATA_DIR: /data/curiosity
      MEMORIA_CURIOSITY_INTERVAL_SECONDS: ${MEMORIA_CURIOSITY_INTERVAL_SECONDS:-60}
      MEMORIA_CURIOSITY_MAX_REQUESTS_HOUR: ${MEMORIA_CURIOSITY_MAX_REQUESTS_HOUR:-30}
      MEMORIA_CURIOSITY_RANDOM_JUMP_RATE: ${MEMORIA_CURIOSITY_RANDOM_JUMP_RATE:-0.10}
      MEMORIA_CURIOSITY_STAGNATION_LIMIT: ${MEMORIA_CURIOSITY_STAGNATION_LIMIT:-3}
      MEMORIA_CURIOSITY_RESULTS_PER_SEARCH: ${MEMORIA_CURIOSITY_RESULTS_PER_SEARCH:-5}
      MEMORIA_CURIOSITY_HTTP_TIMEOUT: ${MEMORIA_CURIOSITY_HTTP_TIMEOUT:-12}
      MEMORIA_CURIOSITY_MAX_PAGE_BYTES: ${MEMORIA_CURIOSITY_MAX_PAGE_BYTES:-1500000}
      MEMORIA_CURIOSITY_TEXT_LIMIT: ${MEMORIA_CURIOSITY_TEXT_LIMIT:-20000}
      MEMORIA_CURIOSITY_NOVELTY_THRESHOLD: ${MEMORIA_CURIOSITY_NOVELTY_THRESHOLD:-0.25}
      MEMORIA_CURIOSITY_SEED: ${MEMORIA_CURIOSITY_SEED:-0}
      MEMORIA_CURIOSITY_SEARCH_URL: ${MEMORIA_CURIOSITY_SEARCH_URL:-https://html.duckduckgo.com/html/?q={query}}
    volumes:
      - server-data:/data
    depends_on:
      memoria: {condition: service_healthy}
      bdr-explorer: {condition: service_healthy}
      model-gateway: {condition: service_healthy}
    ports:
      - "${MEMORIA_SERVER_PORT:-8780}:8780"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8780/api/server/v1/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 5
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    networks: [internal]

volumes:
  memoria-data:
  model-gateway-data:
  server-data:

networks:
  internal:
    driver: bridge
