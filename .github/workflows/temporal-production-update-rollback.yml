name: Temporal production update and rollback

on:
  push:
    branches: [deploy/temporal-explorer-production]
    paths:
      - 'deploy/update-temporal-explorer-production.sh'
      - '.github/workflows/temporal-production-update-rollback.yml'
      - '.github/workflows/deployment-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-update-rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve updater and switch to pre-temporal production server
        run: |
          cp deploy/update-temporal-explorer-production.sh /tmp/update-temporal-explorer-production.sh
          chmod +x /tmp/update-temporal-explorer-production.sh
          git checkout --detach 4c1be255130a5775ae9c6bfefe7a486cdc6a8c86

      - name: Configure old stack with dynamic episode runtime
        run: |
          cp .env.example .env
          python - <<'PY'
          from pathlib import Path
          p=Path('.env')
          vals={
            'MEMORIA_SERVER_PORT':'8780',
            'MEMORIA_SERVER_ADMIN_PASSWORD':'ci-admin-password',
            'MEMORIA_API_KEY':'ci-update-rollback-key',
            'MEMORIA_ORGANIZATION_ID':'ci-update-rollback',
            'MEMORIA_ORGANIZATION_NAME':'CI Update Rollback',
            'MEMORIA_NODE_ID':'memoria:ci-update-rollback:primary',
            'MEMORIA_CURIOSITY_ENABLED':'false',
            'MEMORIA_COMMIT':'ec817397b67ad0fadb3e1ec0b82e6a837869e0a1',
            'BDR_COMMIT':'d11926da38f2f2d389dee44db277223bedc315d1',
          }
          lines=p.read_text().splitlines(); out=[]; seen=set()
          for line in lines:
              key=line.split('=',1)[0] if '=' in line and not line.lstrip().startswith('#') else None
              if key in vals: out.append(f'{key}={vals[key]}'); seen.add(key)
              else: out.append(line)
          for k,v in vals.items():
              if k not in seen: out.append(f'{k}={v}')
          p.write_text('\n'.join(out)+'\n')
          PY

      - name: Start old production-like stack
        run: |
          docker compose build memoria bdr-explorer model-gateway server
          docker compose up -d model-gateway memoria bdr-explorer server
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8780/api/server/v1/health >/tmp/old-health.json 2>/dev/null && exit 0
            sleep 2
          done
          docker compose logs --tail=300
          exit 1

      - name: Seed 300 durable episodes and server-volume marker
        run: |
          docker compose exec -T memoria python - <<'PY'
          import json, os
          from urllib.request import Request, urlopen
          key=os.environ['MEMORIA_API_KEY']; headers={'Content-Type':'application/json','X-Memoria-Key':key}
          for i in range(1,301):
              body=json.dumps({
                  'episode_id':f'rollback-ep-{i}','role':'user','text':f'raw-{i}',
                  'session_id':'ci:rollback','order':i,'timestamp':'2026-09-18T20:00:00Z',
                  'event_type':'rollback_seed','topics':[]
              }).encode()
              with urlopen(Request('http://127.0.0.1:8080/api/v1/episodes',data=body,headers=headers,method='POST'),timeout=10) as r:
                  assert r.status == 201
          with urlopen(Request('http://127.0.0.1:8080/api/v1/episodes/history?limit=5000',headers={'X-Memoria-Key':key}),timeout=10) as r:
              rows=json.load(r)['episodes']
          assert len(rows)==300, len(rows)
          print('OLD_ROWS',len(rows))
          PY
          docker compose exec -T memoria python - <<'PY'
          from pathlib import Path
          import struct
          p=Path('/data/native-runtime/atomic.bdw4')
          b=p.read_bytes()
          pos=0; frames=[]
          while pos < len(b):
              if len(b)-pos < 24: break
              total=struct.unpack('>I',b[pos:pos+4])[0]
              if total < 28 or pos+total > len(b): break
              magic=b[pos+4:pos+8]
              version=struct.unpack('>I',b[pos+8:pos+12])[0]
              seq=struct.unpack('>Q',b[pos+12:pos+20])[0]
              count=struct.unpack('>I',b[pos+20:pos+24])[0]
              frames.append((len(frames),pos,total,magic.decode('ascii','replace'),version,seq,count))
              pos += total
          print('OLD_BDW4_BYTES',len(b))
          print('OLD_BDW4_FRAMES',len(frames))
          print('OLD_BDW4_HEAD',frames[:12])
          dup=[(a,b) for a,b in zip(frames,frames[1:]) if b[5] != a[5]+1]
          print('OLD_BDW4_GAPS',dup[:12])
          assert len(frames) >= 2
          assert frames[0][5] == 1 and frames[1][5] == 1, frames[:2]
          PY
          docker compose exec -T server python - <<'PY'
          from pathlib import Path
          Path('/data/rollback-marker.txt').write_text('before-upgrade',encoding='utf-8')
          PY

      - name: Run production updater
        env:
          MEMORIA_SERVER_DIR: ${{ github.workspace }}
          MEMORIA_SERVER_HEALTH_URL: http://127.0.0.1:8780/api/server/v1/health
          MEMORIA_BACKUP_ROOT: /tmp/memoria-ci-backups
        run: |
          set -o pipefail
          /tmp/update-temporal-explorer-production.sh 2>&1 | tee /tmp/update.log

      - name: Validate upgraded state preserves all 300 rows
        run: |
          test "$(git rev-parse HEAD)" = "ea6cb2adc7124df0eaef5cdab76568525beca6d7"
          grep -q '^MEMORIA_COMMIT=bae11593f2c64bdb63fce84100213c16f88ca796$' .env
          grep -q '^BDR_COMMIT=d11926da38f2f2d389dee44db277223bedc315d1$' .env
          docker compose exec -T memoria python - <<'PY'
          import json, os
          from urllib.request import Request, urlopen
          key=os.environ['MEMORIA_API_KEY']
          with urlopen(Request('http://127.0.0.1:8080/api/v1/episodes/history?limit=5000',headers={'X-Memoria-Key':key}),timeout=10) as r:
              page=json.load(r)
          assert page['schema']=='memoria-episode-history/v1', page
          assert page['count']==300, page
          assert len(page['episodes'])==300, page
          print('UPGRADED_ROWS',page['count'])
          PY
          docker compose exec -T server test "$(docker compose exec -T server cat /data/rollback-marker.txt)" = "before-upgrade"

      - name: Mutate upgraded state after snapshot
        run: |
          docker compose exec -T memoria python - <<'PY'
          import json, os
          from urllib.request import Request, urlopen
          key=os.environ['MEMORIA_API_KEY']; headers={'Content-Type':'application/json','X-Memoria-Key':key}
          body=json.dumps({
              'episode_id':'after-upgrade-301','role':'user','text':'must disappear after rollback',
              'session_id':'ci:rollback','order':301,'timestamp':'2026-09-18T20:01:00Z',
              'event_type':'rollback_mutation','topics':[]
          }).encode()
          with urlopen(Request('http://127.0.0.1:8080/api/v1/episodes',data=body,headers=headers,method='POST'),timeout=10) as r:
              assert r.status==201
          PY
          docker compose exec -T server sh -c "printf after-upgrade > /data/rollback-marker.txt"

      - name: Execute generated rollback
        env:
          MEMORIA_SERVER_HEALTH_URL: http://127.0.0.1:8780/api/server/v1/health
        run: |
          ROLLBACK="$(find /tmp/memoria-ci-backups -name rollback.sh -type f | head -n1)"
          test -n "$ROLLBACK"
          "$ROLLBACK"

      - name: Validate rollback restored old head, pins and exact data snapshot
        run: |
          test "$(git rev-parse HEAD)" = "4c1be255130a5775ae9c6bfefe7a486cdc6a8c86"
          grep -q '^MEMORIA_COMMIT=ec817397b67ad0fadb3e1ec0b82e6a837869e0a1$' .env
          grep -q '^BDR_COMMIT=d11926da38f2f2d389dee44db277223bedc315d1$' .env
          docker compose exec -T memoria python - <<'PY'
          import json, os
          from urllib.request import Request, urlopen
          key=os.environ['MEMORIA_API_KEY']
          with urlopen(Request('http://127.0.0.1:8080/api/v1/episodes/history?limit=5000',headers={'X-Memoria-Key':key}),timeout=10) as r:
              rows=json.load(r)['episodes']
          ids={row['episode_id'] for row in rows}
          assert len(rows)==300, len(rows)
          assert 'rollback-ep-300' in ids
          assert 'after-upgrade-301' not in ids
          print('ROLLBACK_ROWS',len(rows))
          PY
          test "$(docker compose exec -T server cat /data/rollback-marker.txt)" = "before-upgrade"

      - name: Diagnostics on failure
        if: failure()
        run: |
          git status || true
          docker compose ps || true
          docker compose logs --tail=500 || true
          find /tmp/memoria-ci-backups -maxdepth 3 -type f -print 2>/dev/null || true

      - name: Cleanup
        if: always()
        run: docker compose down -v || true

