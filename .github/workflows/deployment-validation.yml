name: Deployment validation

on:
  push:
    paths:
      - "compose.yaml"
      - "docker/**"
      - "scripts/**"
      - ".env.example"
      - ".github/workflows/deployment-validation.yml"
  pull_request:
    paths:
      - "compose.yaml"
      - "docker/**"
      - "scripts/**"
      - ".env.example"

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare non-secret validation environment
        run: |
          cp .env.example .env
          sed -i 's/change-me-with-a-long-random-secret/ci-validation-only/' .env
      - name: Validate Compose model
        run: docker compose config --quiet
      - name: Validate shell scripts
        run: |
          sh -n scripts/prepare-env.sh
          sh -n scripts/install.sh
          sh -n scripts/status.sh
          sh -n scripts/update.sh
          sh -n scripts/uninstall.sh
          bash -n scripts/test-bit-analyze-pipeline.sh
          bash -n scripts/test-continuous-structural-ab.sh
          bash -n scripts/test-physical-temporal-pipeline.sh
      - name: Build deployment images
        run: docker compose build
      - name: Validate bit.analyze to structural association runtime
        run: STRUCTURAL_RUNTIME_SMOKE=1 bash scripts/test-bit-analyze-pipeline.sh
      - name: Compare continuous structural decay on real events
        run: bash scripts/test-continuous-structural-ab.sh
      - name: Validate physical temporal pipeline end to end
        run: bash scripts/test-physical-temporal-pipeline.sh
